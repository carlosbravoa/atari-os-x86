# Build the image in Alpine (x86_64, and the 32-bit i686 image in a 32-bit
# Alpine), compile-check the C code against the host, and boot both images
# in QEMU (BIOS and UEFI; BIOS for i686). release.yml runs this same
# workflow for v* tags before it publishes anything.
name: build

on:
  push:
    branches: ['**']   # branches only: tags go through release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    # Same branch as ALPINE_BRANCH in scripts/alpine-env.sh: keep in step.
    container: alpine:3.24
    timeout-minutes: 90
    steps:
      # git before checkout (without it the action downloads a tarball,
      # no .git, no submodules, no version); GNU tar for actions/cache.
      - name: Tools for checkout and cache
        run: apk add --no-cache git tar

      - name: Trust the checkout (the workspace belongs to the runner user)
        run: git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags, for git describe

      - name: Build packages (the list scripts/alpine-env.sh bootstrap installs)
        run: |
          # shellcheck disable=SC2046 # one word per package
          apk add --no-cache $(scripts/alpine-env.sh pkgs)

      - name: Cache downloads (Mbed TLS)
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('scripts/build-fujinet.sh', 'scripts/alpine-env.sh') }}

      - name: Emulator
        run: scripts/build-emulator.sh

      - name: FujiNet-PC
        run: scripts/build-fujinet.sh

      - name: Image
        # No developer key: an image that carries authorized_keys would never
        # generate the stick holder's own key.
        env:
          DEV_SSH_KEY: '0'
        run: scripts/mkimage.sh

      - name: Compress and checksum
        run: |
          cd build
          img=$(ls atari-os-x86-*.img)
          zip=$(ls atari-os-x86-*-files.zip)   # the dual-boot files (mkimage.sh)
          xz -T0 -6 -k -f "$img"
          sha256sum "$img.xz" "$zip" > SHA256SUMS
          cat SHA256SUMS
          ls -la "$img" "$img.xz" "$zip"

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            build/atari-os-x86-*.img.xz
            build/atari-os-x86-*-files.zip
            build/SHA256SUMS
          if-no-files-found: error
          compression-level: 0   # already xz / zip

  image-i686:
    # The 32-bit image (README, "32-bit machines"). The runner's JavaScript
    # actions (checkout, cache, upload) cannot run inside a 32-bit container,
    # so this job runs on the Ubuntu runner and does the build in a
    # `docker run --platform linux/386 alpine:3.24` step with the workspace
    # mounted, under `setarch i686` like `ARCH=x86 scripts/alpine-env.sh run`.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # tags, for git describe

      - name: Cache downloads (Mbed TLS)
        uses: actions/cache@v4
        with:
          path: build/downloads
          key: downloads-${{ hashFiles('scripts/build-fujinet.sh', 'scripts/alpine-env.sh') }}

      - name: Emulator, FujiNet-PC and image in a 32-bit Alpine
        env:
          DEV_SSH_KEY: '0'   # as for the x86_64 image
        run: |
          docker run --rm -i --platform linux/386 \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e ARCH=x86 -e DEV_SSH_KEY -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            alpine:3.24 sh -e <<'EOF'
          apk add --no-cache util-linux-misc $(scripts/alpine-env.sh pkgs)
          git config --global --add safe.directory '*'
          [ "$(apk --print-arch)" = x86 ] || { echo "not a 32-bit Alpine: $(apk --print-arch)" >&2; exit 1; }
          setarch i686 sh -ec '
            uname -m
            scripts/build-emulator.sh
            scripts/build-fujinet.sh
            scripts/mkimage.sh
          '
          cd build
          img=$(ls atari-os-x86-*-i686.img)
          zip=$(ls atari-os-x86-*-i686-files.zip)
          xz -T0 -6 -k -f "$img"
          sha256sum "$img.xz" "$zip" > SHA256SUMS-i686
          cat SHA256SUMS-i686
          ls -la "$img" "$img.xz" "$zip"
          chown -R "$HOST_UID:$HOST_GID" /work/build
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: image-i686
          path: |
            build/atari-os-x86-*-i686.img.xz
            build/atari-os-x86-*-i686-files.zip
            build/SHA256SUMS-i686
          if-no-files-found: error
          compression-level: 0

  host-build:
    # The -Werror check: atari800's configure appends -Werror, and the port
    # builds with -ansi -pedantic, so non-C89 code fails here. Same as
    # build/atari800-host locally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake pkg-config \
            libdrm-dev libasound2-dev zlib1g-dev

      - name: Emulator against the host libraries
        run: |
          SRC="$GITHUB_WORKSPACE/third_party/atari800"
          # what scripts/build-emulator.sh does before configuring
          ln -sfn ../../../emulator/kms "$SRC/src/kms"
          ln -sfn ../../../emulator/sound_alsa.c "$SRC/src/sound_alsa.c"
          for p in "$GITHUB_WORKSPACE"/emulator/patches/*.patch; do
            git -C "$SRC" apply "$p"
          done
          (cd "$SRC" && autoreconf -fi)
          mkdir -p build/atari800-host
          cd build/atari800-host
          "$SRC/configure" --with-video=kms --with-sound=alsa --enable-netsio \
            --without-readline --without-x --with-png=no --with-mp3=no --with-zlib=yes \
            --disable-monitorbreak --disable-monitortrace \
            CFLAGS="-g -O2 -I$GITHUB_WORKSPACE/common"
          make -j"$(nproc)"

      - name: init, static
        run: gcc -static -Os -Wall -Wextra -Werror -Icommon -o "$RUNNER_TEMP/init" init/init.c

  smoke:
    needs: [image, image-i686]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact: image
            modes: bios uefi
            system: qemu-system-x86_64
            cpu: ''        # the host's, with KVM
            mem: ''        # 1024
          - arch: i686
            artifact: image-i686
            modes: bios    # Ubuntu's ovmf has no 32-bit build
            system: qemu-system-i386
            cpu: n270      # an Atom netbook, no 64-bit mode
            mem: '512'
    name: smoke (${{ matrix.arch }})
    env:
      QEMU_SYSTEM: ${{ matrix.system }}
      QEMU_CPU: ${{ matrix.cpu }}   # empty = the harness's default
      QEMU_MEM: ${{ matrix.mem }}
    steps:
      - uses: actions/checkout@v4   # for scripts/qemu-test.sh

      - name: QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools

      - name: KVM for the runner user
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [ -w /dev/kvm ]; then echo "KVM available"; else echo "no KVM: TCG, waiting up to 600 s"; fi

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build

      - name: Unpack
        run: |
          cd build
          sha256sum -c SHA256SUMS*
          unxz atari-os-x86-*.img.xz
          ls -la

      - name: Serial debug shell for the test (this copy only)
        run: scripts/qemu-test.sh debug-image "$(ls build/atari-os-x86-*.img)"

      - name: Boot BIOS and UEFI
        run: |
          QEMU_IMG=$(ls build/atari-os-x86-*.img)
          export QEMU_IMG
          rc=0
          for mode in ${{ matrix.modes }}; do
            export QEMU_TEST_DIR="$GITHUB_WORKSPACE/build/qemu-test/$mode"
            echo "::group::$mode"
            scripts/qemu-test.sh start "$mode"
            if scripts/qemu-test.sh wait; then
              sleep 5
              scripts/qemu-test.sh serial 'echo status | nc local:/run/atari.ctl' 3 | tee "$QEMU_TEST_DIR/status.txt"
              grep -q '^version ' "$QEMU_TEST_DIR/status.txt" || { echo "::error::$mode: no version in the status reply"; rc=1; }
            else
              echo "::error::$mode: the emulator never started"
              rc=1
            fi
            scripts/qemu-test.sh shot "$QEMU_TEST_DIR/screen.png" || true
            scripts/qemu-test.sh stop
            echo "::endgroup::"
          done
          exit $rc

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            build/qemu-test/*/*.png
            build/qemu-test/*/*.log
            build/qemu-test/*/*.txt
            build/qemu-test/*/qemu.out
          if-no-files-found: warn
