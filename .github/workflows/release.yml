# On a v* tag: the whole build workflow (both images, host build, QEMU
# smoke boots), then a GitHub release with the x86_64 and i686 images, their
# dual-boot files zips, one SHA256SUMS, flash.sh and the two dual-boot
# installers.
name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create with the default GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: image*   # image (x86_64) and image-i686
          merge-multiple: true
          path: build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # all four must carry the tag's version
          ls build/atari-os-x86-"$TAG".img.xz build/atari-os-x86-"$TAG"-files.zip \
             build/atari-os-x86-"$TAG"-i686.img.xz build/atari-os-x86-"$TAG"-i686-files.zip
          cat build/SHA256SUMS-i686 >> build/SHA256SUMS && rm build/SHA256SUMS-i686
          (cd scripts && sha256sum flash.sh install-linux.sh install-windows.ps1) >> build/SHA256SUMS
          cat build/SHA256SUMS
          sed -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" .github/release-template.md > build/notes.md
          # --notes text goes above the generated notes
          gh release create "$TAG" build/atari-os-x86-*.img.xz build/atari-os-x86-*-files.zip build/SHA256SUMS \
            scripts/flash.sh scripts/install-linux.sh scripts/install-windows.ps1 \
            --verify-tag --title "atari-os-x86 $TAG" --generate-notes --notes "$(cat build/notes.md)"
