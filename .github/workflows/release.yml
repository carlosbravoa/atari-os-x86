# On a v* tag: the whole build workflow (image, host build, QEMU smoke
# boot), then a GitHub release with the image, its checksums and flash.sh.
name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # gh release create with the default GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls build/atari-os-x86-"$TAG".img.xz   # the image must carry the tag's version
          (cd scripts && sha256sum flash.sh) >> build/SHA256SUMS
          sed -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" .github/release-template.md > build/notes.md
          # --notes text goes above the generated notes
          gh release create "$TAG" build/atari-os-x86-*.img.xz build/SHA256SUMS scripts/flash.sh \
            --verify-tag --title "atari-os-x86 $TAG" --generate-notes --notes "$(cat build/notes.md)"
